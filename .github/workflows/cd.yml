name: CD

on:
  push:
    branches:
      - feature/DOC-2-T14-CI-CD
      - main
  workflow_dispatch: {}

concurrency:
  group: cd-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build & push ${{ matrix.name }} image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: ./apps/backend
          - name: frontend
            context: ./apps/web
          - name: caddy
            context: ./caddy
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name
        id: image
        run: |
          name="${REGISTRY}/$(echo '${{ github.repository_owner }}/doclift-${{ matrix.name }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=$name:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Compute image tags
        id: images
        run: |
          owner_lower=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "backend=${REGISTRY}/${owner_lower}/doclift-backend:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "frontend=${REGISTRY}/${owner_lower}/doclift-frontend:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "caddy=${REGISTRY}/${owner_lower}/doclift-caddy:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: SSH and redeploy via docker compose
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script: |
            set -e
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            cd /opt/doclift
            export BACKEND_IMAGE=${{ steps.images.outputs.backend }}
            export FRONTEND_IMAGE=${{ steps.images.outputs.frontend }}
            export CADDY_IMAGE=${{ steps.images.outputs.caddy }}
            docker compose pull
            docker compose up -d --remove-orphans --wait --wait-timeout 120
            docker image prune -f
